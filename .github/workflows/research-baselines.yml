name: FREM research baseline contract

on:
  pull_request:
    paths:
      - "frem/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/research-baselines.yml"
  push:
    branches: [main]
    paths:
      - "frem/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/research-baselines.yml"

permissions:
  contents: read

jobs:
  exploratory-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install baseline tooling
        run: python -m pip install -e ".[dev]"

      - name: Causality and deterministic control tests
        run: python -m pytest -q tests

      - name: Scope disclaimer
        run: |
          echo "No real financial dataset, protected test set, or trained JEPA model is used."
